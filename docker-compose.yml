version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"               
      - "--providers.docker=true"            
      - "--providers.docker.exposedbydefault=false" 
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true" 
      - "--certificatesresolvers.myresolver.acme.email=tuemail@dominio.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" 
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro" 
      - "./letsencrypt:/letsencrypt"
    networks:
      - kanban_net

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kanban_user
      POSTGRES_PASSWORD: ultra_secret
      POSTGRES_DB: kanban_db
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d 
    networks:
      - kanban_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban_user"]
      interval: 5s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    networks:
      - kanban_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  nats:
    image: nats:2.10-alpine
    command: "-js" 
    networks:
      - kanban_net

  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_HOST=postgres
      - DB_USER=kanban_user
      - DB_PASS=ultra_secret
      - DB_NAME=kanban_db
      - REDIS_URL=redis:6379
      - NATS_URL=nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.go_api.rule=PathPrefix(`/api`) || PathPrefix(`/ws`)" 
      - "traefik.http.routers.go_api.entrypoints=websecure"
      - "traefik.http.routers.go_api.tls.certresolver=myresolver"
      - "traefik.http.services.go_api.loadbalancer.server.port=3000" 
      - "traefik.http.routers.go_api.middlewares=ws_headers"
      - "traefik.http.middlewares.ws_headers.headers.customrequestheaders.Connection=Upgrade"
      - "traefik.http.middlewares.ws_headers.headers.customrequestheaders.Upgrade=websocket"
    networks:
      - kanban_net
    deploy:
      replicas: 2 

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)" 
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
    networks:
      - kanban_net

networks:
  kanban_net:
    driver: bridge

volumes:
  pg_data: